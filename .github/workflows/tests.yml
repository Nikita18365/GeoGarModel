name: GeoGarModel tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: geogarmodel-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[test]"
      - name: Запуск полного набора тестов
        timeout-minutes: 20
        run: python -m pytest -vv -s --tb=short -ra -o faulthandler_timeout=60 --junitxml=pytest-results.xml
      - name: Сохранение результатов тестирования
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.job }}-${{ runner.os }}-${{ matrix.python || '3.11' }}
          path: pytest-results.xml
          if-no-files-found: warn
  optional-models:
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,boosting,neural,volume]"
      - name: Запуск полного набора тестов
        timeout-minutes: 20
        run: python -m pytest -vv -s --tb=short -ra -o faulthandler_timeout=60 --junitxml=pytest-results.xml
      - name: Сохранение результатов тестирования
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.job }}-${{ runner.os }}-${{ matrix.python || '3.11' }}
          path: pytest-results.xml
          if-no-files-found: warn
